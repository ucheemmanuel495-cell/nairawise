
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#092e25">
  <title>Create Account | NairaWise</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #17251e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #092e25;
      color: white;
      padding: 20px 6%;
      font-size: 25px;
      font-weight: 800;
    }
    header span { color: #9ce8b9; }
    main {
      width: 100%;
      max-width: 460px;
      margin: 45px auto;
      padding: 0 20px;
      flex: 1;
    }
    .panel {
      background: white;
      padding: 28px 24px;
      border: 1px solid #e0e8e1;
      border-radius: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    .intro { color: #64736a; margin: 0 0 24px; font-size: 14px; }
    label { display: block; font-weight: bold; font-size: 14px; margin: 17px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd8ce;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }
    input:focus { outline: 2px solid #75bd91; border-color: #238052; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #0b4935;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    button:disabled { opacity: .6; }
    #message { font-size: 14px; margin-top: 16px; overflow-wrap: anywhere; }
    .signin { margin-top: 22px; text-align: center; font-size: 14px; }
    a { color: #126b45; }
    .notice { margin-top: 22px; font-size: 12px; color: #68766d; line-height: 1.6; }
    footer { padding: 22px; text-align: center; color: #64736a; font-size: 12px; }
  </style>
</head>
<body>
  <header>Naira<span>Wise</span></header>

  <main>
    <section class="panel">
      <h1>Create your account</h1>
      <p class="intro">Start your NairaWise journey.</p>

      <form id="signup-form">
        <label for="full-name">Full name</label>
        <input id="full-name" name="full-name" autocomplete="name"
          required maxlength="100" placeholder="Enter your full name">

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email"
          required placeholder="you@example.com">

        <label for="password">Create password</label>
        <input id="password" name="password" type="password"
          autocomplete="new-password" minlength="8" required
          placeholder="At least 8 characters">

        <button id="submit-button" type="submit">Create account</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>

      <p class="signin">Already registered? <a href="login.html">Sign in</a></p>

      <p class="notice">
        NairaWise is under development. Registration does not create an
        investment account or enable deposits, withdrawals or returns.
        Never send money to anyone claiming otherwise.
      </p>
    </section>
  </main>

  <footer>© <span id="year"></span> NairaWise</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById("signup-form").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Registration is not connected yet. Please wait for the secure setup.";
    });
  </script>
</body>
</html>
