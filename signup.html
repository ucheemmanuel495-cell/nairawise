
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092e25">
  <title>Create Account | NairaWise</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #193027;
    }

    header {
      background: #092e25;
      color: white;
      padding: 20px;
      font-size: 25px;
      font-weight: bold;
    }

    header span { color: #9ce8b9; }

    main {
      width: 100%;
      max-width: 440px;
      margin: 45px auto;
      padding: 20px;
    }

    .panel {
      background: white;
      padding: 26px;
      border: 1px solid #e0e8e2;
      border-radius: 14px;
    }

    h1 { margin-top: 0; font-size: 28px; }

    .intro { color: #65746a; font-size: 14px; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd8ce;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #0b4935;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled { opacity: 0.6; }

    #message {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .small {
      margin-top: 20px;
      color: #65746a;
      font-size: 12px;
      line-height: 1.6;
    }

    a { color: #126b45; }

    footer {
      text-align: center;
      padding: 20px;
      color: #65746a;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>Naira<span>Wise</span></header>

  <main>
    <section class="panel">
      <h1>Create your account</h1>
      <p class="intro">Register to get started with NairaWise.</p>

      <form id="signup-form">
        <label for="full-name">Full name</label>
        <input
          id="full-name"
          type="text"
          autocomplete="name"
          maxlength="100"
          required
          placeholder="Enter your full name"
        >

        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="Enter your email"
        >

        <label for="password">Create password</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          placeholder="At least 8 characters"
        >

        <button id="submit-button" type="submit">
          Create account
        </button>

        <p id="message" role="status" aria-live="polite"></p>
      </form>

      <p class="small">
        NairaWise is under development. Registration does not enable
        investments, deposits or withdrawals. Never send money to this
        website until its financial services have been properly established.
      </p>
    </section>
  </main>

  <footer>
    © <span id="year"></span> NairaWise
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    const SUPABASE_URL = "const SUPABASE_URL = "https://your-project-id.supabase.co";";
    const SUPABASE_KEY = "sb_publishable_zN2YgSYuLpgWyXOmP6VqvA_ZuGIx-ac";

    const form = document.getElementById("signup-form");
    const button = document.getElementById("submit-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName =
        document.getElementById("full-name").value.trim();
      const email =
        document.getElementById("email").value.trim();
      const password =
        document.getElementById("password").value;

      if (
        SUPABASE_URL === "PASTE_YOUR_PROJECT_URL_HERE" ||
        SUPABASE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
      ) {
        message.textContent =
          "Setup is not finished yet. Please complete the secure connection.";
        return;
      }

      if (!window.supabase) {
        message.textContent =
          "The registration service could not load. Please try again later.";
        return;
      }

      button.disabled = true;
      message.textContent = "Creating your account...";

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { full_name: fullName },
            emailRedirectTo: window.location.origin + "/"
          }
        });

        if (error) throw error;

        if (data.user && data.user.identities &&
            data.user.identities.length === 0) {
          message.textContent =
            "This email may already be registered. Try signing in or use another email.";
        } else {
          message.textContent = data.session
            ? "Your account was created. Further account features are being set up."
            : "Registration received. Check your email for a confirmation link.";
          form.reset();
        }
      } catch (error) {
        message.textContent =
          error.message || "Registration failed. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
